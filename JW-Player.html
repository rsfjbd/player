/* =========================================================
   ROOT
========================================================= */

:root{

    --bg-1:#0a0a12;
    --bg-2:#14101f;

    --grad-a:#22d3ee;
    --grad-b:#a78bfa;
    --grad-c:#fb923c;

    --text-dim:#7a7a92;

    --font:'Poppins','Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Courier New',monospace;
}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

}


/* =========================================================
   PAGE
========================================================= */

html,
body{

    width:100%;
    height:100%;

    position:fixed;
    inset:0;

    overflow:hidden;

    background:#000;

    font-family:var(--font);

    overscroll-behavior:none;

}


/* =========================================================
   PLAYER WRAPPER
========================================================= */

#player-wrapper{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    contain:layout paint size;

}


/* =========================================================
   PLAYER
========================================================= */

#player{

    position:absolute;

    inset:0;

    width:100%!important;
    height:100%!important;

    touch-action:manipulation;

    contain:layout paint;

}


/* =========================================================
   VIDEO

   IMPORTANT:
   object-fit: fill is intentionally preserved.
========================================================= */

#player video,
.jw-video.jw-reset{

    width:100%!important;
    height:100%!important;

    object-fit:fill!important;

    touch-action:manipulation;

    background:#000;

}


/* =========================================================
   JW PLAYER SKIN
========================================================= */

.jw-skin-glow .jw-display-icon-container{

    background:
        rgba(167,139,250,.10)!important;

    border:
        1px solid
        rgba(167,139,250,.4);

    backdrop-filter:none!important;

}


.jw-skin-glow .jw-button-color{

    color:#fff!important;

}


.jw-skin-glow .jw-controlbar{

.jw-skin-glow .jw-slider-time .jw-progress{

}


.jw-skin-glow .jw-knob{

}


/* =========================================================
   LOADER
========================================================= */

#loader{

    position:absolute;

    inset:0;

    background:

    justify-content:center;

    z-index:99;

    opacity:1;

    visibility:visible;

    pointer-events:none;

    transition:
        opacity .20s ease,
        visibility .20s ease;

}


.hide-now{

    opacity:0!important;

    visibility:hidden!important;

}


/* =========================================================
   LOADER TV
========================================================= */

.tuner{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:18px;

}


.tv-wrap{

    position:relative;

    width:72px;
    height:72px;

    display:flex;

    align-items:center;
    justify-content:center;

}


.tv-glow{

    position:absolute;

    width:100%;
    height:100%;

    border-radius:50%;

    background:

            rgba(167,139,250,.25),

    animation:

}


@keyframes glow-pulse{

    0%,100%{

        transform:scale(.9);

        opacity:.5;

    }

    50%{

        transform:scale(1.08);

        opacity:.9;

    }

}


.tv-icon{

    position:relative;

    width:56px;
    height:56px;

}


.tv-icon .tv-body{

    fill:none;

    stroke:var(--text);

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;

}


.tv-icon .screen-bars rect{

    transform-origin:center bottom;

    animation:
        bar-flicker 1.8s
        ease-in-out infinite;

}


.tv-icon .screen-bars rect:nth-child(1){

    fill:var(--grad-a);

    animation-delay:-1.2s;

}


.tv-icon .screen-bars rect:nth-child(2){

    fill:var(--grad-b);

    animation-delay:-.9s;

}


.tv-icon .screen-bars rect:nth-child(3){

    fill:var(--grad-c);

    animation-delay:-.6s;

}


.tv-icon .screen-bars rect:nth-child(4){

    fill:var(--grad-b);

    animation-delay:-.3s;

}


.tv-icon .screen-bars rect:nth-child(5){

    fill:var(--grad-a);

}


@keyframes bar-flicker{

    0%,100%{

        transform:scaleY(.5);

        opacity:.6;

    }

    50%{

        transform:scaleY(1);

        opacity:1;

    }

}


/* =========================================================
   BRAND
========================================================= */

.brand-name{

    font-size:15px;

    font-weight:700;

    letter-spacing:1px;

    text-transform:uppercase;

    background:
        linear-gradient(

    background-clip:text;

    color:transparent;

}


.brand-name b{

    -webkit-text-fill-color:var(--text);

}


/* =========================================================
   LOADING DOTS
========================================================= */

.dots{

    display:flex;

    gap:6px;

}


.dots span{

    width:6px;

    height:6px;

    border-radius:50%;

    background:var(--grad-b);

    animation:
        dot-pulse 1.2s
        ease-in-out infinite;

}


.dots span:nth-child(2){

    animation-delay:.2s;

}


.dots span:nth-child(3){

    animation-delay:.4s;

}


@keyframes dot-pulse{

    0%,80%,100%{

        transform:scale(.6);

        opacity:.35;

    }

    40%{

        transform:scale(1);

        opacity:1;

    }

}


/* =========================================================
   STATUS
========================================================= */

.status-line{

    font-family:var(--mono);

    font-size:9.5px;

    letter-spacing:2.5px;

    color:var(--text-dim);

    text-transform:uppercase;

}


/* =========================================================
   ERROR STATE
========================================================= */

.state-content{

    text-align:center;

    color:var(--text);

    padding:0 24px;

}


.state-content .glyph{

    font-size:34px;

    color:var(--alert);

    margin-bottom:14px;

    line-height:1;

}


.state-content .glyph.warn{

    color:var(--warn);

}


.state-content p.title{

    font-size:13px;

    letter-spacing:1px;

    font-weight:600;

}


.state-content p.sub{

    font-family:var(--mono);

    font-size:10.5px;

    color:var(--text-dim);

    margin-top:8px;

    letter-spacing:.5px;

    max-width:280px;

    word-break:break-word;

}


.state-content .brand-name{

    display:block;

    margin-top:18px;

}


/* =========================================================
   RETRY
========================================================= */

.retry-btn{

    margin-top:16px;

    padding:8px 20px;

    font-family:var(--font);

    font-weight:600;

    font-size:11px;

    color:#0a0a12;

    background:
        linear-gradient(
            90deg,
            var(--grad-a),
            var(--grad-b)
        );

    border:none;

    border-radius:18px;

    cursor:pointer;

    touch-action:manipulation;

}


.retry-btn:active{

    transform:scale(.96);

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms!important;

        animation-iteration-count:1!important;

        transition-duration:.01ms!important;

    }

}

<script>

(() => {

"use strict";


/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const streamSource =
    params.get("url");


const forcedType =
    (params.get("type") || "")
    .toLowerCase();


const startMuted =
    params.get("mute") === "1";


/* =========================================================
   DOM
========================================================= */

const loaderEl =
    document.getElementById("loader");


const statusEl =
    document.getElementById("status-line");


const playerContainer =
    document.getElementById("player");


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    /*
     * Maximum time allowed for initial connection.
     */

    initialTimeout:12000,


    /*
     * Maximum reconnect attempts.
     */

    maxRetries:6,


    /*
     * Buffer has to continue for this long
     * before loader appears.
     */

    bufferDelay:1000,


    /*
     * Fullscreen resize protection.
     */

    fullscreenGrace:1200,


    /*
     * Reconnect delay.

     * IMPORTANT:
     * This is only used after real playback errors.
     */

    reconnectBase:900,

    reconnectMax:5000

};


/* =========================================================
   STATE
========================================================= */

let player = null;

let retryCount = 0;

let retryTimer = null;

let initialTimer = null;

let bufferTimer = null;

let statusTimer = null;

let hasPlayed = false;

let reconnecting = false;

let fullscreenTransition = false;

let pageDestroyed = false;


/*
 * This flag is true only when the user
 * intentionally presses a JW control.
 */

let controlInteraction = false;


/* =========================================================
   LOADER
========================================================= */

function showLoader(){

    if(pageDestroyed){

        return;

    }

    loaderEl.classList.remove(
        "hide-now"
    );

}


function hideLoader(){

    loaderEl.classList.add(
        "hide-now"
    );

}


/* =========================================================
   STATUS
========================================================= */

function startStatus(){

    const messages = [

        "CONNECTING",
        "LOADING",
        "BUFFERING"

    ];


    let index = 0;


    statusTimer =
        setInterval(() => {


            if(hasPlayed){

                return;

            }


            index =
                (index + 1) %
                messages.length;


            statusEl.textContent =
                messages[index];


        },2200);

}


function stopStatus(){

    if(statusTimer){

        clearInterval(statusTimer);

        statusTimer = null;

    }

}


/* =========================================================
   STREAM TYPE DETECTION
========================================================= */

function detectType(raw){

    if(forcedType){

        return forcedType;

    }


    const clean =
        raw
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();


    if(clean.endsWith(".m3u8")){

        return "hls";

    }


    if(clean.endsWith(".mpd")){

        return "dash";

    }


    if(
        clean.endsWith(".mp4") ||
        clean.endsWith(".mov")
    ){

        return "mp4";

    }


    if(clean.endsWith(".webm")){

        return "webm";

    }


    if(
        clean.endsWith(".ogg") ||
        clean.endsWith(".ogv")
    ){

        return "ogg";

    }


    /*
     * Tokenized stream URL.
     */

    const lower =
        raw.toLowerCase();


    if(lower.includes(".m3u8")){

        return "hls";

    }


    if(lower.includes(".mpd")){

        return "dash";

    }


    return null;

}


/* =========================================================
   BRAND
========================================================= */

function brandBlock(){

    return `

        <div class="brand-name">

            <b>RS LIVE</b> TV

        </div>

    `;

}


/* =========================================================
   ERROR STATE
========================================================= */

function showNoStreamState(error){

    clearTimeout(retryTimer);

    clearTimeout(initialTimer);

    clearTimeout(bufferTimer);

    stopStatus();

    showLoader();


    let message =
        "The source could not be reached.";


    if(
        error &&
        error.message
    ){

        message =
            String(error.message)
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .slice(0,220);

    }


    loaderEl.innerHTML = `

        <div class="state-content">


            <div class="glyph">

                &#10060;

            </div>


            <p class="title">

                No streaming — this link won't play

            </p>


            <p class="sub">

                ${message}

            </p>


            <button
                class="retry-btn"
                onclick="location.reload()"
            >

                Retry

            </button>


            ${brandBlock()}


        </div>

    `;

}


/* =========================================================
   NO URL
========================================================= */

if(!streamSource){

    showLoader();


    loaderEl.innerHTML = `

        <div class="state-content">


            <div class="glyph warn">

                &#9888;

            </div>


            <p class="title">

                No stream URL supplied

            </p>


            <p class="sub">

                Add ?url=YOUR_STREAM_LINK
                to this page's address.

            </p>


            ${brandBlock()}


        </div>

    `;


    return;

}


/* =========================================================
   PLAYLIST
========================================================= */

const streamType =
    detectType(streamSource);


const playlistItem = {

    file:streamSource

};


if(streamType){

    playlistItem.type =
        streamType;

}


/* =========================================================
   JW PLAYER SETUP
========================================================= */

player =
    jwplayer("player").setup({

        playlist:[
            playlistItem
        ],


        width:"100%",

        height:"100%",


        autostart:true,


        mute:startMuted,


        preload:"auto",


        stretching:"uniform",


        liveTimeout:0,


        displaytitle:false,


        skin:{
            name:"glow"
        }

    });


/* =========================================================
   INITIAL TIMEOUT
========================================================= */

initialTimer =
    setTimeout(() => {


        if(!hasPlayed){

            reconnect(
                true,
                null
            );

        }


    },CONFIG.initialTimeout);


/* =========================================================
   READY
========================================================= */

player.on("ready",() => {


    console.log(
        "RS Player ready:",
        streamType || "auto"
    );


    setupTouchProtection();


});


/* =========================================================
   FIRST FRAME
========================================================= */

player.on("firstFrame",() => {


    hasPlayed = true;

    retryCount = 0;

    reconnecting = false;


    clearTimeout(initialTimer);

    clearTimeout(bufferTimer);


    stopStatus();


    hideLoader();


});


/* =========================================================
   PLAY
========================================================= */

player.on("play",() => {


    hasPlayed = true;

    retryCount = 0;

    reconnecting = false;


    clearTimeout(initialTimer);

    clearTimeout(bufferTimer);


    stopStatus();


    hideLoader();


});


/* =========================================================
   PAUSE PROTECTION
========================================================= */

player.on("pause",() => {


    /*
     * If the user intentionally pressed
     * JW control bar Play/Pause button,
     * allow the pause.
     */

    if(controlInteraction){

        controlInteraction = false;

        return;

    }


    /*
     * Otherwise the pause likely came from
     * touching the video/display area.
     *
     * Restore playback immediately.
     */

    if(
        hasPlayed &&
        !pageDestroyed
    ){

        setTimeout(() => {


            if(
                !player ||
                pageDestroyed
            ){

                return;

            }


            try{


                if(
                    player.getState &&
                    player.getState() === "paused"
                ){


                    const playPromise =
                        player.play(true);


                    if(
                        playPromise &&
                        typeof playPromise.catch ===
                        "function"
                    ){

                        playPromise.catch(
                            () => {}
                        );

                    }

                }


            }catch(e){}


        },50);

    }

});


/* =========================================================
   BUFFER
========================================================= */

player.on("buffer",() => {


    /*
     * Never display loader while
     * fullscreen is resizing.
     */

    if(fullscreenTransition){

        return;

    }


    clearTimeout(bufferTimer);


    bufferTimer =
        setTimeout(() => {


            if(
                !fullscreenTransition &&
                hasPlayed &&
                !pageDestroyed
            ){

                showLoader();

                statusEl.textContent =
                    "BUFFERING";

            }


        },CONFIG.bufferDelay);


});


/* =========================================================
   FULLSCREEN
========================================================= */

player.on("fullscreen",() => {


    /*
     * IMPORTANT:
     *
     * DO NOT:
     *
     * player.load()
     * player.stop()
     * player.play()
     *
     * here.
     */


    fullscreenTransition = true;


    clearTimeout(bufferTimer);


    hideLoader();


    setTimeout(() => {

        fullscreenTransition = false;

    },CONFIG.fullscreenGrace);


});


/* =========================================================
   TOUCH PROTECTION
========================================================= */

function setupTouchProtection(){


    if(!playerContainer){

        return;

    }


    /*
     * VIDEO TOUCH START
     *
     * We don't prevent default.
     * This keeps JW controls working.
     */

    playerContainer.addEventListener(

        "touchstart",

        (event) => {


            const target =
                event.target;


            /*
             * JW control bar:
             * let it work normally.
             */

            if(
                target &&
                target.closest(
                    ".jw-controlbar"
                )
            ){

                return;

            }


            /*
             * Video area:
             *
             * Do nothing.
             *
             * No play()
             * No pause()
             * No load()
             */

        },

        {
            passive:true,
            capture:true
        }

    );


    /*
     * VIDEO TOUCH END
     */

    playerContainer.addEventListener(

        "touchend",

        (event) => {


            const target =
                event.target;


            /*
             * Control bar gets normal
             * JW behavior.
             */

            if(
                target &&
                target.closest(
                    ".jw-controlbar"
                )
            ){

                return;

            }


            /*
             * Screen touch:
             *
             * Nothing happens.
             *
             * Stream keeps playing.
             */

        },

        {
            passive:true,
            capture:true
        }

    );


    /*
     * Prevent browser double-tap zoom
     * on video only.
     */

    playerContainer.addEventListener(

        "dblclick",

        (event) => {


            const target =
                event.target;


            if(
                target &&
                target.closest(
                    ".jw-video"
                )
            ){

                event.preventDefault();

            }


        },

        {
            passive:false,
            capture:true
        }

    );

}


/* =========================================================
   CONTROL BAR DETECTION
========================================================= */

document.addEventListener(

    "pointerdown",

    (event) => {


        const target =
            event.target;


        if(!target){

            return;

        }


        /*
         * Detect JW control button.
         *
         * This is the only situation where
         * pause is intentionally allowed.
         */

        const button =
            target.closest(
                ".jw-controlbar .jw-button-container"
            );


        if(button){

            controlInteraction = true;

        }


    },

    {
        passive:true,
        capture:true
    }

);


/* =========================================================
   REAL PLAYBACK ERROR
========================================================= */

player.on("error",(error) => {


    console.warn(
        "Playback error:",
        error
    );


    /*
     * Touch/fullscreen never calls this.
     *
     * Only real JW playback errors
     * trigger reconnect.
     */

    reconnect(
        false,
        error
    );


});


/* =========================================================
   SETUP ERROR
========================================================= */

player.on("setupError",(error) => {


    console.warn(
        "Setup error:",
        error
    );


    reconnect(
        false,
        error
    );


});


/* =========================================================
   RECONNECT
========================================================= */

function reconnect(
    initial,
    error
){


    if(pageDestroyed){

        return;

    }


    /*
     * Never reload source while
     * fullscreen is transitioning.
     */

    if(fullscreenTransition){


        setTimeout(() => {


            reconnect(
                initial,
                error
            );


        },1000);


        return;

    }


    /*
     * Prevent duplicate reconnects.
     */

    if(reconnecting){

        return;

    }


    /*
     * Maximum attempts.
     */

    if(
        retryCount >=
        CONFIG.maxRetries
    ){


        showNoStreamState(
            error
        );


        return;

    }


    reconnecting = true;

    retryCount++;


    const delay =
        Math.min(

            CONFIG.reconnectBase *
            Math.pow(
                1.45,
                retryCount - 1
            ),

            CONFIG.reconnectMax

        );


    statusEl.textContent =
        `RECONNECTING (${retryCount}/${CONFIG.maxRetries})`;


    showLoader();


    clearTimeout(retryTimer);


    retryTimer =
        setTimeout(() => {


            if(pageDestroyed){

                return;

            }


            try{


                /*
                 * IMPORTANT:
                 *
                 * load() is used ONLY
                 * after a genuine error.
                 *
                 * Normal screen touch
                 * never reaches here.
                 */

                player.load([
                    playlistItem
                ]);


                const playPromise =
                    player.play(true);


                if(
                    playPromise &&
                    typeof playPromise.catch ===
                    "function"
                ){

                    playPromise.catch(
                        () => {}
                    );

                }


            }catch(e){


                console.warn(
                    "Reconnect failed:",
                    e
                );


            }


            reconnecting = false;


        },delay);

}


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(

    "pagehide",

    () => {


        pageDestroyed = true;


        clearTimeout(
            retryTimer
        );


        clearTimeout(
            initialTimer
        );


        clearTimeout(
            bufferTimer
        );


        stopStatus();


    },

    {
        passive:true
    }

);


/* =========================================================
   START STATUS
========================================================= */

startStatus();


})();
</script>
