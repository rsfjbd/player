<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>RS Player Pro - Compact Loader</title>

    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script>
        jwplayer.key = "Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==";
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            position: fixed;
        }

        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- কন্ট্রোলার কাস্টমাইজেশন --- */
        .jw-skin-glow .jw-display-icon-container {
            display: none !important; /* সেন্টারের বড় প্লে/পজ আইকন সম্পূর্ণ বাদ */
        }
        .jw-skin-glow .jw-button-color {
            color: #ffffff !important;
        }
        .jw-skin-glow .jw-controlbar {
            background: transparent !important;
            backdrop-filter: none !important;
        }

        /* --- লোডার ডিজাইন --- */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            flex-direction: column;
            transition: opacity 0.4s ease;
        }

        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader-brand {
            text-align: center;
            z-index: 10;
        }
        .tv-icon {
            font-size: 24px;
            color: #00c3ff;
            text-shadow: 0 0 10px #00c3ff;
        }
        .brand-name {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        .brand-name span {
            color: #00c3ff;
        }

        .neon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: rotate-vortex 1.5s linear infinite;
        }
        .neon-ring:nth-child(1) {
            border-top: 2px solid #00c3ff;
            border-right: 2px solid #00c3ff;
            box-shadow: 0 0 10px #00c3ff;
        }
        .neon-ring:nth-child(2) {
            border-bottom: 2px solid #ff007f;
            border-left: 2px solid #ff007f;
            animation-direction: reverse;
            animation-duration: 2s;
            box-shadow: 0 0 10px #ff007f;
        }

        @keyframes rotate-vortex {
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- ভিডিও সাইড কাটা ফিক্স --- */
        .jw-video.jw-reset {
            object-fit: fill !important;
        }

        .hide-now {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* এরর মেসেজ */
        .error-content {
            text-align: center;
            color: #fff;
            z-index: 100;
        }
        .error-content i {
            font-size: 40px;
            color: #ff4d4d;
            margin-bottom: 15px;
        }

        .desktop-error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }
        .desktop-error i {
            font-size: 30px;
            margin-bottom: 10px;
            display: block;
        }
        .desktop-error .small-text {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <div id="loader">
            <div class="loader-container">
                <div class="neon-ring"></div>
                <div class="neon-ring"></div>
                <div class="loader-brand">
                    <i class="fas fa-tv tv-icon"></i>
                    <div class="brand-name">RS LIVE <span>TV</span></div>
                </div>
            </div>
            <div class="loading-text">BUFFERING...</div>
        </div>
        <div id="player"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const streamSource = urlParams.get('url');
        // 'live' বা 'vod' প্যারামিটার না দিলে অটো ডিটেক্ট করবে (m3u8 এক্সটেনশনে "live" শব্দ না থাকলে VOD ধরা হবে)
        const forcedType = (urlParams.get('mode') || '').toLowerCase(); // 'live' | 'vod' | ''

        if (streamSource) {
            const isDesktop = !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

            if (isDesktop) {
                console.log('🖥️ Desktop detected - trying to load stream with HLS');
            }

            // লাইভ নাকি পুরনো/রেকর্ডেড (VOD) ভিডিও সেটা ঠিক করা
            let streamType = "vod";
            if (forcedType === "live") {
                streamType = "live";
            } else if (forcedType === "vod") {
                streamType = "vod";
            } else if (/live|stream/i.test(streamSource)) {
                streamType = "live";
            }

            const player = jwplayer("player").setup({
                playlist: [{
                    file: streamSource,
                    type: "hls"
                }],
                width: "100%",
                height: "100%",
                autostart: true,
                stretching: "exactfit",
                skin: { name: "glow" },
                displaytitle: false,
                displaydescription: false,
                // লাইভের জন্য streamtype লাইভ দেখাবে, পুরনো ভিডিওর জন্য সাধারণ VOD সিকবার দেখাবে
                liveTimeout: streamType === "live" ? 0 : undefined
            });

            player.on("ready", () => {
                player.setMute(false);
                player.setVolume(100);
                console.log('✅ Player ready, mode:', streamType);
            });

            player.on("play", () => {
                document.getElementById("loader").classList.add("hide-now");
                console.log('▶️ Playing');
            });

            player.on("buffer", () => {
                document.getElementById("loader").classList.remove("hide-now");
                console.log('⏳ Buffering...');
            });

            // ভিডিও শেষ হলে (VOD-এর ক্ষেত্রে প্রযোজ্য)
            player.on("complete", () => {
                console.log('✅ Playback complete');
            });

            player.on("error", (error) => {
                const loader = document.getElementById("loader");
                loader.classList.remove("hide-now");

                if (isDesktop) {
                    loader.innerHTML = `
                        <div class="error-content desktop-error">
                            <i class="fas fa-desktop"></i>
                            <p>⚠️ Stream may not be available on desktop.</p>
                            <p style="font-size:14px;color:#94a3b8;margin-top:5px;">Please try on mobile device.</p>
                            <div class="brand-name" style="margin-top:15px;">RS LIVE <span>TV</span></div>
                            <p style="font-size:11px;color:#64748b;margin-top:10px;">Error: ${error.message || 'Unknown error'}</p>
                        </div>
                    `;
                } else {
                    loader.innerHTML = `
                        <div class="error-content">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Stream Offline!</p>
                            <div class="brand-name">RS LIVE <span>TV</span></div>
                        </div>
                    `;
                }
                console.error('❌ Player error:', error);
            });

        } else {
            document.getElementById("loader").innerHTML = '<div class="brand-name">No Stream URL Found</div>';
        }
    </script>

</body>
    </html>
