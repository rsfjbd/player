<style>
:root{
    --bg-1:#0a0a12;
    --bg-2:#14101f;
    --grad-a:#22d3ee;
    --grad-b:#a78bfa;
    --grad-c:#fb923c;
    --warn:#ffb84d;
    --alert:#ff5d5d;
    --text:#eef0f7;
    --text-dim:#7a7a92;
    --font:'Poppins','Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Courier New',monospace;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:#000;
    font-family:var(--font);
    overscroll-behavior:none;
}

#player-wrapper{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    contain:layout paint size;
}

#player{
    position:absolute;
    inset:0;
    width:100%!important;
    height:100%!important;
    touch-action:manipulation;
}

/*
=========================================================
 IMPORTANT:
 Keep object-fit: fill exactly as requested.
=========================================================
*/

#player video,
.jw-video.jw-reset{
    width:100%!important;
    height:100%!important;
    object-fit:fill!important;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

/* JW */

.jw-skin-glow .jw-display-icon-container{
    background:rgba(167,139,250,.10)!important;
    border:1px solid rgba(167,139,250,.4);
    backdrop-filter:none!important;
}

.jw-skin-glow .jw-button-color{
    color:#fff!important;
}

.jw-skin-glow .jw-controlbar{
    background:linear-gradient(
        0deg,
        rgba(0,0,0,.78),
        transparent
    )!important;
    backdrop-filter:none!important;
}

.jw-skin-glow .jw-slider-time .jw-progress{
    background:var(--grad-b)!important;
}

.jw-skin-glow .jw-knob{
    background:var(--grad-b)!important;
}

/* LOADER */

#loader{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            80% 60% at 50% 40%,
            var(--bg-2) 0%,
            var(--bg-1) 70%
        );

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    z-index:99;

    opacity:1;
    visibility:visible;

    transition:
        opacity .20s ease,
        visibility .20s ease;

    pointer-events:none;
}

.hide-now{
    opacity:0!important;
    visibility:hidden!important;
}

.tuner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}

.tv-wrap{
    position:relative;
    width:72px;
    height:72px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.tv-glow{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(167,139,250,.25),
            transparent 70%
        );

    animation:glow-pulse 2.8s ease-in-out infinite;
}

@keyframes glow-pulse{
    0%,100%{
        transform:scale(.9);
        opacity:.5;
    }

    50%{
        transform:scale(1.08);
        opacity:.9;
    }
}

.tv-icon{
    position:relative;
    width:56px;
    height:56px;
}

.tv-icon .tv-body{
    fill:none;
    stroke:var(--text);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.tv-icon .screen-bars rect{
    transform-origin:center bottom;
    animation:bar-flicker 1.8s ease-in-out infinite;
}

.tv-icon .screen-bars rect:nth-child(1){
    fill:var(--grad-a);
    animation-delay:-1.2s;
}

.tv-icon .screen-bars rect:nth-child(2){
    fill:var(--grad-b);
    animation-delay:-.9s;
}

.tv-icon .screen-bars rect:nth-child(3){
    fill:var(--grad-c);
    animation-delay:-.6s;
}

.tv-icon .screen-bars rect:nth-child(4){
    fill:var(--grad-b);
    animation-delay:-.3s;
}

.tv-icon .screen-bars rect:nth-child(5){
    fill:var(--grad-a);
}

@keyframes bar-flicker{
    0%,100%{
        transform:scaleY(.5);
        opacity:.6;
    }

    50%{
        transform:scaleY(1);
        opacity:1;
    }
}

.brand-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;

    background:
        linear-gradient(
            90deg,
            var(--grad-a),
            var(--grad-b)
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand-name b{
    color:var(--text);
    -webkit-text-fill-color:var(--text);
}

.dots{
    display:flex;
    gap:6px;
}

.dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--grad-b);

    animation:dot-pulse 1.2s ease-in-out infinite;
}

.dots span:nth-child(2){
    animation-delay:.2s;
}

.dots span:nth-child(3){
    animation-delay:.4s;
}

@keyframes dot-pulse{
    0%,80%,100%{
        transform:scale(.6);
        opacity:.35;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}

.status-line{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:2.5px;
    color:var(--text-dim);
    text-transform:uppercase;
}

/* ERROR */

.state-content{
    text-align:center;
    color:var(--text);
    padding:0 24px;
}

.state-content .glyph{
    font-size:34px;
    color:var(--alert);
    margin-bottom:14px;
    line-height:1;
}

.state-content .glyph.warn{
    color:var(--warn);
}

.state-content p.title{
    font-size:13px;
    letter-spacing:1px;
    font-weight:600;
}

.state-content p.sub{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:8px;
    letter-spacing:.5px;
    max-width:280px;
    word-break:break-word;
}

.state-content .brand-name{
    display:block;
    margin-top:18px;
}

.retry-btn{
    margin-top:16px;
    padding:8px 20px;

    font-family:var(--font);
    font-weight:600;
    font-size:11px;

    color:#0a0a12;

    background:
        linear-gradient(
            90deg,
            var(--grad-a),
            var(--grad-b)
        );

    border:none;
    border-radius:18px;

    cursor:pointer;
    touch-action:manipulation;
}

.retry-btn:active{
    transform:scale(.96);
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<div id="player-wrapper">

    <div id="loader">

        <div class="tuner">

            <div class="tv-wrap">
                <div class="tv-glow"></div>

                <svg
                    class="tv-icon"
                    viewBox="0 0 64 64"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        class="tv-body"
                        d="M22 12 32 20 42 12"
                    />

                    <clipPath id="screenClip">
                        <rect
                            x="12"
                            y="20"
                            width="40"
                            height="26"
                            rx="4"
                        />
                    </clipPath>

                    <g
                        class="screen-bars"
                        clip-path="url(#screenClip)"
                    >

                        <rect x="12" y="20" width="8" height="26"/>
                        <rect x="20" y="20" width="8" height="26"/>
                        <rect x="28" y="20" width="8" height="26"/>
                        <rect x="36" y="20" width="8" height="26"/>
                        <rect x="44" y="20" width="8" height="26"/>

                    </g>

                    <rect
                        class="tv-body"
                        x="12"
                        y="20"
                        width="40"
                        height="26"
                        rx="4"
                    />

                    <line
                        class="tv-body"
                        x1="24"
                        y1="46"
                        x2="24"
                        y2="50"
                    />

                    <line
                        class="tv-body"
                        x1="40"
                        y1="46"
                        x2="40"
                        y2="50"
                    />

                    <line
                        class="tv-body"
                        x1="20"
                        y1="50"
                        x2="44"
                        y2="50"
                    />

                </svg>
            </div>

            <div class="brand-name">
                <b>RS LIVE</b> TV
            </div>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div
                class="status-line"
                id="status-line"
            >
                CONNECTING
            </div>

        </div>

    </div>

    <div id="player"></div>

</div>

<script>
(() => {

"use strict";

/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const streamSource =
    params.get("url");

const forcedType =
    (params.get("type") || "")
    .toLowerCase();

const startMuted =
    params.get("mute") === "1";

/* =========================================================
   DOM
========================================================= */

const loaderEl =
    document.getElementById("loader");

const statusEl =
    document.getElementById("status-line");

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    initialTimeout:12000,

    maxRetries:6,

    /*
     * Buffer must remain for 1000ms
     * before loader is shown.
     */
    bufferDelay:1000,

    /*
     * Fullscreen transition protection.
     */
    fullscreenGrace:1200,

    /*
     * Reconnect starts quickly but does not
     * hammer the server.
     */
    reconnectBase:900,

    reconnectMax:5000

};

/* =========================================================
   STATE
========================================================= */

let player = null;

let retryCount = 0;

let retryTimer = null;

let initialTimer = null;

let bufferTimer = null;

let statusTimer = null;

let hasPlayed = false;

let reconnecting = false;

let fullscreenTransition = false;

let pageDestroyed = false;

/* =========================================================
   LOADER
========================================================= */

function showLoader(){

    if(pageDestroyed){
        return;
    }

    loaderEl.classList.remove(
        "hide-now"
    );
}

function hideLoader(){

    loaderEl.classList.add(
        "hide-now"
    );
}

/* =========================================================
   STATUS
========================================================= */

function startStatus(){

    const messages = [
        "CONNECTING",
        "LOADING",
        "BUFFERING"
    ];

    let index = 0;

    statusTimer =
        setInterval(() => {

            if(hasPlayed){
                return;
            }

            index =
                (index + 1) %
                messages.length;

            statusEl.textContent =
                messages[index];

        },2200);
}

function stopStatus(){

    if(statusTimer){

        clearInterval(statusTimer);
        statusTimer = null;

    }
}

/* =========================================================
   TYPE
========================================================= */

function detectType(raw){

    if(forcedType){
        return forcedType;
    }

    const clean =
        raw
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();

    if(clean.endsWith(".m3u8")){
        return "hls";
    }

    if(clean.endsWith(".mpd")){
        return "dash";
    }

    if(
        clean.endsWith(".mp4") ||
        clean.endsWith(".mov")
    ){
        return "mp4";
    }

    if(clean.endsWith(".webm")){
        return "webm";
    }

    if(
        clean.endsWith(".ogg") ||
        clean.endsWith(".ogv")
    ){
        return "ogg";
    }

    const lower =
        raw.toLowerCase();

    if(lower.includes(".m3u8")){
        return "hls";
    }

    if(lower.includes(".mpd")){
        return "dash";
    }

    return null;
}

/* =========================================================
   BRAND
========================================================= */

function brandBlock(){

    return `
        <div class="brand-name">
            <b>RS LIVE</b> TV
        </div>
    `;

}

/* =========================================================
   ERROR
========================================================= */

function showNoStreamState(error){

    clearTimeout(retryTimer);
    clearTimeout(initialTimer);
    clearTimeout(bufferTimer);

    stopStatus();

    showLoader();

    let message =
        "The source could not be reached.";

    if(
        error &&
        error.message
    ){

        message =
            String(error.message);

    }

    message =
        message
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .slice(0,220);

    loaderEl.innerHTML = `

        <div class="state-content">

            <div class="glyph">
                &#10060;
            </div>

            <p class="title">
                No streaming — this link won't play
            </p>

            <p class="sub">
                ${message}
            </p>

            <button
                class="retry-btn"
                onclick="location.reload()"
            >
                Retry
            </button>

            ${brandBlock()}

        </div>

    `;

}

/* =========================================================
   NO URL
========================================================= */

if(!streamSource){

    showLoader();

    loaderEl.innerHTML = `

        <div class="state-content">

            <div class="glyph warn">
                &#9888;
            </div>

            <p class="title">
                No stream URL supplied
            </p>

            <p class="sub">
                Add ?url=YOUR_STREAM_LINK
                to this page's address.
            </p>

            ${brandBlock()}

        </div>

    `;

    return;
}

/* =========================================================
   SOURCE
========================================================= */

const streamType =
    detectType(streamSource);

const playlistItem = {
    file:streamSource
};

if(streamType){

    playlistItem.type =
        streamType;

}

/* =========================================================
   PLAYER
========================================================= */

player =
    jwplayer("player").setup({

        playlist:[
            playlistItem
        ],

        width:"100%",
        height:"100%",

        autostart:true,

        mute:startMuted,

        preload:"auto",

        stretching:"uniform",

        liveTimeout:0,

        displaytitle:false,

        skin:{
            name:"glow"
        }

    });

/* =========================================================
   INITIAL TIMER
========================================================= */

initialTimer =
    setTimeout(() => {

        if(!hasPlayed){

            /*
             * Only initial connection timeout.
             * This does NOT reload on touch/fullscreen.
             */

            reconnect(
                true,
                null
            );

        }

    },CONFIG.initialTimeout);

/* =========================================================
   READY
========================================================= */

player.on("ready",() => {

    console.log(
        "RS Player ready:",
        streamType || "auto"
    );

});

/* =========================================================
   FIRST FRAME
========================================================= */

player.on("firstFrame",() => {

    hasPlayed = true;

    retryCount = 0;

    reconnecting = false;

    clearTimeout(initialTimer);
    clearTimeout(bufferTimer);

    stopStatus();

    hideLoader();

});

/* =========================================================
   PLAY
========================================================= */

player.on("play",() => {

    hasPlayed = true;

    retryCount = 0;

    reconnecting = false;

    clearTimeout(initialTimer);
    clearTimeout(bufferTimer);

    stopStatus();

    hideLoader();

});

/* =========================================================
   BUFFER
========================================================= */

player.on("buffer",() => {

    /*
     * Critical fix:
     *
     * Fullscreen / touch related buffer events
     * must NOT cover the video with loader.
     */

    if(fullscreenTransition){

        return;

    }

    clearTimeout(bufferTimer);

    bufferTimer =
        setTimeout(() => {

            /*
             * Re-check fullscreen state.
             */

            if(
                !fullscreenTransition &&
                !pageDestroyed &&
                hasPlayed
            ){

                showLoader();

                statusEl.textContent =
                    "BUFFERING";

            }

        },CONFIG.bufferDelay);

});

/* =========================================================
   FULLSCREEN
========================================================= */

player.on("fullscreen",(event) => {

    /*
     * IMPORTANT:
     *
     * Do NOT call:
     * player.load()
     * player.play()
     * player.stop()
     *
     * here.
     */

    fullscreenTransition = true;

    clearTimeout(bufferTimer);

    /*
     * Never hide/restart/reload video.
     * Just keep current playback alive.
     */

    hideLoader();

    setTimeout(() => {

        fullscreenTransition = false;

    },CONFIG.fullscreenGrace);

});

/* =========================================================
   TOUCH PROTECTION
========================================================= */

/*
 * Do NOT prevent normal touch on JW controls.
 *
 * Preventing touch propagation here can interfere
 * with JW Player's own control system.
 *
 * We only prevent double-tap browser zoom.
 */

let lastTouchTime = 0;

document.addEventListener(
    "touchend",
    (event) => {

        const now =
            Date.now();

        const target =
            event.target;

        if(
            target &&
            (
                target.closest("#player")
            )
        ){

            if(
                now - lastTouchTime <
                280
            ){

                event.preventDefault();

            }

            lastTouchTime = now;

        }

    },
    {
        passive:false
    }
);

/* =========================================================
   DOUBLE CLICK
========================================================= */

document.addEventListener(
    "dblclick",
    (event) => {

        const target =
            event.target;

        if(
            target &&
            target.closest("#player")
        ){

            event.preventDefault();

        }

    },
    {
        passive:false
    }
);

/* =========================================================
   REAL ERROR ONLY
========================================================= */

player.on("error",(error) => {

    console.warn(
        "Playback error:",
        error
    );

    /*
     * A real JW error is required before reconnect.
     * Touch/fullscreen never reaches this function.
     */

    reconnect(
        false,
        error
    );

});

player.on("setupError",(error) => {

    console.warn(
        "Setup error:",
        error
    );

    reconnect(
        false,
        error
    );

});

/* =========================================================
   RECONNECT
========================================================= */

function reconnect(
    initial,
    error
){

    if(pageDestroyed){
        return;
    }

    /*
     * Don't reconnect while fullscreen is transitioning.
     */

    if(fullscreenTransition){

        setTimeout(() => {

            reconnect(
                initial,
                error
            );

        },1000);

        return;
    }

    /*
     * Prevent duplicate reconnect.
     */

    if(reconnecting){
        return;
    }

    if(
        retryCount >=
        CONFIG.maxRetries
    ){

        showNoStreamState(error);

        return;
    }

    reconnecting = true;

    retryCount++;

    const delay =
        Math.min(
            CONFIG.reconnectBase *
            Math.pow(
                1.45,
                retryCount - 1
            ),
            CONFIG.reconnectMax
        );

    statusEl.textContent =
        `RECONNECTING (${retryCount}/${CONFIG.maxRetries})`;

    showLoader();

    clearTimeout(retryTimer);

    retryTimer =
        setTimeout(() => {

            if(pageDestroyed){
                return;
            }

            /*
             * IMPORTANT:
             *
             * load() is ONLY executed here
             * after a real error/reconnect condition.
             *
             * Normal screen touch cannot trigger this.
             */

            try{

                player.load([
                    playlistItem
                ]);

                const playPromise =
                    player.play(true);

                if(
                    playPromise &&
                    typeof playPromise.catch ===
                    "function"
                ){

                    playPromise.catch(
                        () => {}
                    );

                }

            }catch(e){

                console.warn(
                    "Reconnect failed:",
                    e
                );

            }

            reconnecting = false;

        },delay);

}

/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        pageDestroyed = true;

        clearTimeout(retryTimer);
        clearTimeout(initialTimer);
        clearTimeout(bufferTimer);

        stopStatus();

    },
    {
        passive:true
    }
);

/* =========================================================
   START
========================================================= */

startStatus();

})();
</script>

</body>
</html>
